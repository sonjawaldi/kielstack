<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Kielstack | Digitale Lösungen für Unternehmen</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kielstack entwickelt individuelle Webanwendungen, automatisiert Geschäftsprozesse und begleitet digitale Produkte – persönlich aus Kiel."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
    <script>
      // Vor dem ersten Zeichnen setzen, sonst blitzt die Seite im falschen Modus auf.
      // Die Logik danach liegt im AppComponent; der Schluessel muss gleich bleiben.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('kielstack-theme');
        } catch (e) {}
        if (stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta property="og:title" content="Kielstack | Digitale Lösungen für Unternehmen" />
    <meta property="og:description" content="Software, die zu Ihrem Unternehmen passt." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kielstack.de/" />
    <link rel="canonical" href="https://kielstack.de/" />
    <link rel="icon" type="image/png" href="assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="assets/brand/favicon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
