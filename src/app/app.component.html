<a href="#main-content" class="skip-link">Zum Inhalt springen</a>

<div class="site">
  <header class="hdr">
    <div class="wrap hdr-bar">
      <a class="logo" routerLink="/" (click)="closeMenu()" aria-label="Kielstack – zur Startseite">
        <img src="assets/brand/kielstack-logo.png" alt="" width="1024" height="1024" />
      </a>
      <div class="hdr-act">
        <nav class="nav" aria-label="Hauptnavigation">
          <a routerLink="/leistungen">Leistungen</a>
          <a routerLink="/prozess">Zusammenarbeit</a>
          <a routerLink="/ueber-mich">Über Kielstack</a>
          <a class="btn btn-p" routerLink="/kontakt">Projekt anfragen</a>
        </nav>
        <button
          type="button"
          class="icon-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="darkMode() ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren'"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @if (darkMode()) {
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              ></path>
            } @else {
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
            }
          </svg>
        </button>
        <button
          type="button"
          class="icon-btn burger"
          (click)="menuOpen.set(!menuOpen())"
          [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
          [attr.aria-expanded]="menuOpen()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @if (menuOpen()) {
              <path d="M6 6l12 12M18 6L6 18"></path>
            } @else {
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            }
          </svg>
        </button>
      </div>
    </div>
    @if (menuOpen()) {
      <nav class="menu" aria-label="Mobile Navigation">
        <a routerLink="/leistungen" (click)="closeMenu()">Leistungen</a>
        <a routerLink="/prozess" (click)="closeMenu()">Zusammenarbeit</a>
        <a routerLink="/ueber-mich" (click)="closeMenu()">Über Kielstack</a>
        <a class="btn btn-p" routerLink="/kontakt" (click)="closeMenu()">Projekt anfragen</a>
      </nav>
    }
  </header>

  <main id="main-content">
    <router-outlet />
  </main>

  <footer class="ftr">
    <div class="wrap ftr-bar">
      <div class="ftr-brand">
        <img src="assets/brand/kielstack-logo.png" alt="Kielstack" width="1024" height="1024" />
        <span>Kielstack – Sonja Waldenspuhl · Digitale Lösungen für Unternehmen</span>
      </div>
      <nav aria-label="Rechtliches">
        <a routerLink="/kontakt">Kontakt</a>
        <a href="https://sonjawaldenspuhl.de/impressum">Impressum</a>
        <a href="https://sonjawaldenspuhl.de/datenschutz">Datenschutz</a>
        <a href="https://sonjawaldenspuhl.de/barrierefreiheit">Barrierefreiheit</a>
      </nav>
      <span>© 2026 Kielstack</span>
    </div>
  </footer>
</div>
